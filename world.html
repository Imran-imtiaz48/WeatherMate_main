<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- links -->
  <link rel="icon" type="image/png" href="img/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/world.css" />
  <!-- Title -->
  <title>World Weather</title>
</head>

<body>
  <div class="pc">
    <!-- Navigation -->
    <nav>
      <ul>
        <li><a href="index.html" aria-label="Home"><i class="fa-solid fa-location-arrow"></i></a></li>
        <li><a href="search.html" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a></li>
        <li><a class="active" href="world.html" aria-label="World View"><i class="fa-solid fa-earth-americas"></i></a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main>
      <!-- Header Section -->
      <header class="section">
        <div class="date">April 7, 2024</div>
        <button class="button" aria-label="Add New Location">
          <i class="fa-solid fa-circle-plus btn-icon"></i>
        </button>
      </header>

      <!-- Add Section -->
      <section class="section-box">
        <div class="add-section">
          <div class="add-section-title">
            <h2>Add a New Place</h2>
          </div>

          <!-- Search Field -->
          <div class="search">
            <div class="search-icon">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <input class="searchinput" type="text" placeholder="Search..." aria-label="Search city" />
          </div>

          <!-- Messages -->
          <div class="messages">
            <div class="error-message">City not found</div>
            <div class="normal-message">Search your city to add</div>
            <div class="added-message">Successfully added ✔</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JavaScript -->
  <script src="js/world.js"></script>
</body>

</html>
